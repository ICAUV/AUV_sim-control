name: MATLAB tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB R2025b
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
          cache: true

      - name: test_auv1_matches_remus100
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab/tests'); test_auv1_matches_remus100

      - name: test_auv1_actuator_signs
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab/tests'); test_auv1_actuator_signs

      - name: test_SIMauv1_regression
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab/tests'); test_SIMauv1_regression

      - name: test_auv1Visualiser
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab/tests'); test_auv1Visualiser
